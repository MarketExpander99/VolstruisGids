{% for listing in listings %}
<div class="col-md-4 mb-3">
    <div class="card h-100 shadow-sm">
        <!-- Photo placeholder (Phase 4 will replace with real upload) -->
        <div class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height: 180px;">
            <span class="text-muted">📸 Photo coming soon</span>
        </div>
        <div class="card-body">
            {% if listing.is_business_ad %}
            <span class="badge bg-success mb-2">Business Ad</span>
            {% endif %}
            <h5 class="card-title">{{ listing.title }}</h5>
            <h6 class="text-success">R{{ listing.price | default(0) | int }}</h6>
            <p class="card-text text-muted small">{{ listing.area }}</p>
            <small class="text-muted">Posted: {{ listing.created_at.strftime('%d %b %Y') }}</small>
            <br>
            <a href="{{ url_for('listings.detail', listing_id=listing.id) }}" class="btn btn-sm btn-outline-primary mt-2">View Details →</a>
        </div>
    </div>
</div>
{% endfor %}

{% if listings %}
<!-- Out-of-band update for the Load More button (HTMX magic) -->
<div id="load-more-container" hx-swap-oob="true" class="text-center mt-4">
    <button 
        hx-get="/load-more?offset={{ next_offset }}"
        hx-target="#listings-feed"
        hx-swap="beforeend"
        class="btn btn-outline-primary">
        Load More Ads
    </button>
</div>
{% endif %}
