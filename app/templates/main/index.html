 <div class="flex-grow-1"
 <h5 id=-user-store-name- class="mb-0 fw-bold"</h5"
 <small class="text-muted"Local store â€¢ Klein Karoo</small"
 </div"
 <div class="d-flex gap-2"
 <button type=-button- onclick=-exitStoreMode()- class="btn btn-outline-secondary btn-sm px-3"

 </div>

 <div class="text-center text-muted small mt-4 pb-3"
 Volstruis Gids â€¢ All listings posted by your neighbours in the Klein Karoo
 </div>
</div>

<!-- Grok AI Chat Modal (unchanged) -->
<div class="modal fade- id="grokChatModal- tabindex=--1- aria-hidden=-true"
 <div class="modal-dialog modal-dialog-centered modal-lg"
 <div class="modal-content"
 <div class="modal-header bg-info text-white"
 <h5 class="modal-title"<img src="{{ url_for('static', filename='img/GrokLogo.png') }}-
 alt="Grok- height=-26- class="me-2- style="vertical-align: middle;"
 Ask Grok about this listing</h5"
 <button type=-button- class="btn-close btn-close-white- data-modal"</button"
 </div"
 <div class="modal-body"
 <div id="chat-log- style="max-height: 320px; overflow-y: auto; padding: 10px; background: #f8f9fa; border-radius: 8px; margin-bottom: 15px;"</div"
 <div id="grok-thinking- style="display: none; align-items: center; gap: 10px; margin-bottom: 10px;"
 <div class="spinner-border spinner-border-sm text-info- role=-status"</div"
 <span class="text-muted"Grok is thinking<span class="thinking-dots"...</span"</span="$2"
 </div>
 <div class="input-group"
 <input type=-text- id="grok-input- class="form-control- placeholder=-e.g. Would this gearbox work in my 2018 Hilux?-
 onkeypress=-if (event.key === 'Enter') sendGrokMessage()"
 <button class="btn btn-info- onclick=-sendGrokMessage()"
 <i class="bi bi-send"</i" Send
 </button>
 </div>
 <small class="text-muted"2 free questions per day. After that, 1 credit per question.</small>
 </div>
 </div>
 </div>
</div>

<script>
let currentGrokListing = null;
function openGrokChat(listingId, title, description, area) {
 currentGrokListing = { id: listingId, title: title, description: description, area: area };
 document.getElementById('chat-log').innerHTML = `
 <div class="text-muted small mb-2"Ask anything about <strong>${title}</strong> (${area || 'Klein Karoo'})</div>
 `;
 document.getElementById('grok-input').value = '';
 document.getElementById('grok-thinking').style.display = 'none';
 const modalEl = document.getElementById('grokChatModal');
 const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
 modal.show();
}
function appendMessage(role, text) {
 const log = document.getElementById('chat-log');
 const div = document.createElement('div');
 div.style.marginBottom = '8px';
 
 if (role === 'user') {
 div.innerHTML = `<div class="d-flex justify-content-end"<div class="bg-primary text-white px-3 py-2 rounded-3- style="max-width: 80%;"${text}</div"</div>`;
 } else if (role === 'grok') {
 div.innerHTML = `<div class="d-flex"<div class="bg-white border px-3 py-2 rounded-3- style="max-width: 80%;"<strong"Grok:</strong> ${text}</div></div>`;
 } else {
 div.innerHTML = `<div class="text-danger small"${text}</div>`;
 }
 log.appendChild(div);
 log.scrollTop = log.scrollHeight;
}
function sendGrokMessage() {
 const input = document.getElementById('grok-input');
 const question = input.value.trim();
 if (!question || !currentGrokListing) return;
 appendMessage('user', question);
 input.value = '';
 const thinking = document.getElementById('grok-thinking');
 thinking.style.display = 'flex';
 fetch('/api/ai/ask', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({
 listing_id: currentGrokListing.id,
 question: question
 })
 })
 .then(r => r.json())
 .then(data => {
 thinking.style.display = 'none';
 if (data.error) {
 appendMessage('error', data.error);
 } else {
 appendMessage('grok', data.answer);
 }
 })
 .catch(() => {
 thinking.style.display = 'none';
 appendMessage('error', 'Connection error. Please try again.');
 });
}
document.addEventListener('click', function(e) {
 const btn = e.target.closest('.grok-ask-btn');
 if (!btn) return;
 if (btn.dataset.grokListingId) {
 openGrokChat(
 btn.dataset.grokListingId,
 btn.dataset.grokTitle || '',
 btn.dataset.grokDescription || '',
 btn.dataset.grokArea || ''
 );
 }
});
</script>

<script>
 let currentPage = 1;
 let hasMore = true;
 let isLoading = false;

 function showMainSections() {
 const hero = document.getElementById('hero-banner');
 const title = document.getElementById('main-title');
 const filters = document.getElementById('filter-form');
 const cats = document.getElementById('popular-categories-section');
 if (hero) hero.classList.remove('d-none');
 if (title) title.classList.remove('d-none');
 if (filters) filters.classList.remove('d-none');
 if (cats) cats.classList.remove('d-none');
 }

 function hideMainSections() {
 const hero = document.getElementById('hero-banner');
 const title = document.getElementById('main-title');
 const filters = document.getElementById('filter-form');
 const cats = document.getElementById('popular-categories-section');
 if (hero) hero.classList.add('d-none');
 if (title) title.classList.add('d-none');
 if (filters) filters.classList.add('d-none');
 if (cats) cats.classList.add('d-none');
 }

 function exitStoreMode() {
 const url = new URL(window.location);
 url.searchParams.delete('user_id');
 window.history.pushState({}, '', url);
 document.getElementById('user-store-header').classList.add('d-none');
 showMainSections();
 currentPage = 1;
 fetchListings(1, false);
 loadPopularCategories();
 }

 function shareStoreWhatsApp() {
 const params = new URLSearchParams(window.location.search);
 const userId = params.get('user_id');
 if (!userId) return;
 const nameEl = document.getElementById('user-store-name');
 const storeName = nameEl ? nameEl.textContent.trim() : -this store-;
 const baseUrl = window.location.origin + window.location.pathname;
 const shareUrl = `${baseUrl}?user_id=${userId}`;
 const text = `Check out ${storeName} on Volstruis Gids â€“ Klein Karoo Classifieds: ${shareUrl}`;
 const waUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
 window.open(waUrl, '_blank');
 }

 function showLoadingState(append) {
 const container = document.getElementById('listings-container');
 if (!append) container.innerHTML = '';
 const loading = document.getElementById('loading-more');
 if (loading) loading.classList.remove('d-none');
 isLoading = true;
 }

 function hideLoadingState() {
 const loading = document.getElementById('loading-more');
 if (loading) loading.classList.add('d-none');
 isLoading = false;
 }

 function fetchListings(page = 1, append = false) {
 if (isLoading) return;
 showLoadingState(append);

 const q = document.getElementById('q').value.trim();
 const town = document.getElementById('town').value;
 const post_type = document.getElementById('post_type').value;
 const category = document.getElementById('category') ? document.getElementById('category').value.trim() : '';
 const user_id = new URLSearchParams(window.location.search).get('user_id');
 let url = `/api/listings?page=${page}`;
 if (q) url += `&q=${encodeURIComponent(q)}`;
 if (town) url += `&town=${encodeURIComponent(town)}`;
 if (post_type) url += `&post_type=${post_type}`;
 if (category) url += `&category=${encodeURIComponent(category)}`;
 if (user_id) url += `&user_id=${user_id}`;

 fetch(url)
 .then(response => {
 if (!response.ok) throw new Error(`Server error: ${response.status}`);
 return response.json();
 })
 .then(data => {
 const container = document.getElementById('listings-container');
 if (!append) container.innerHTML = '';

 const header = document.getElementById('user-store-header');
 const logoEl = document.getElementById('user-store-logo');
 const nameEl = document.getElementById('user-store-name');
 if (user_id && data.listings.length > 0) {
 const first = data.listings[0];
 let logoSrc = '/static/img/default-listing.jpg';
 let storeName = 'Seller\'s Store';
 const headerPic = first.profile_pic || first.profile_picture || first.user_profile_pic || first.avatar || first.user_avatar;
 if (headerPic) logoSrc = headerPic;
 if (first.business_name) storeName = first.business_name;
 else if (first.username) storeName = first.username.replace(/^@+/, '') + -'s Store-;
 logoEl.src = logoSrc;
 nameEl.textContent = storeName;
 header.classList.remove('d-none');
 hideMainSections();
 window.scrollTo({ top: 0, behavior: 'smooth' });
 } else {
 header.classList.add('d-none');
 showMainSections();
 }

 if (data.listings.length === 0 && !append) {
 container.innerHTML = `
 <div class="col-12 text-center py-5"
 <i class="bi bi-search display-4 text-muted mb-3"</i>
 <h5 class="mb-2"No listings found</h5>
 <p class="text-muted small"Try adjusting your search or filters. New ads are posted every day!</p>
 <a href=-{{ url_for('listings.create') }}- class="btn btn-primary btn-sm mt-2"Post the first ad for this search</a>
 </div>`;
 document.getElementById('load-more-btn').style.display = 'none';
 hideLoadingState();
 return;
 }

 data.listings.forEach(listing => {
 const isBoosted = listing.is_promoted || listing.last_reposted_at;
 const isBusinessType = listing.is_business_ad || !!listing.business_name;

 let cardExtraClasses = 'card h-100 shadow-sm border-0 post-type-' + (listing.post_type || listing.ad_type || 'sale');
 if (isBusinessType) cardExtraClasses += ' business-listing';
 cardExtraClasses += (isBusinessType ? '' : ' post-type-' + (listing.post_type || 'sale'));
 if (isBoosted) cardExtraClasses += ' boosted';

 let posterHTML = '';
 const ownerPic = listing.profile_pic || listing.profile_picture || listing.user_profile_pic || listing.avatar || listing.user_avatar || null;

 if (ownerPic) {
 const borderColor = isBusinessType ? '#E6B800' : '#6c757d';
 const avatarImg = `<img src="${ownerPic}- alt="Profile Picture- class="rounded-circle me-2- width=-36- height=-36- style="object-fit:cover; border: 2px solid ${borderColor};"`;
 const nameText = isBusinessType 
 ? (listing.business_name || 'Business')
 : `@${(listing.username || '').replace(/^@+/, '')}`;
 const badge = isBusinessType 
 ? `<span class="badge bg-warning text-dark ms-2- style=-font-size: 0.65rem; font-weight:600;"BUSINESS</span"` 
 : '';
 const nameLink = `<a href=-?user_id=${listing.user_id}- onclick=-event.preventDefault(); filterByUser(${listing.user_id});- class="text-decoration-none text-primary"${nameText}</a"`;
 
 posterHTML = `
 <div class="d-flex align-items-center mb-3"
 ${avatarImg}
 <div"
 <strong class="small"${nameLink}</strong>
 ${badge}
 </div>
 </div>`;
 } else {
 const initialSource = listing.business_name || listing.username || 'U';
 const initial = initialSource.charAt(0).toUpperCase();
 const bgColor = isBusinessType ? '#8B4513' : '#6c757d';
 const avatarInitial = `<div class="rounded-circle me-2 d-flex align-items-center justify-content-center- style="width:36px; height:36px; background:${bgColor}; color:white; font-weight:700; font-size:0.9rem;"${initial}</div"`;
 const nameText = isBusinessType 
 ? (listing.business_name || 'Business')
 : `@${(listing.username || '').replace(/^@+/, '')}`;
 const badge = isBusinessType 
 ? `<span class="badge bg-warning text-dark ms-2- style="font-size: 0.65rem; font-weight:600;"BUSINESS</span"` 
 : '';
 const nameLink = `<a href=-?user_id=${listing.user_id}- onclick=-event.preventDefault(); filterByUser(${listing.user_id});- class="text-decoration-none text-primary"${nameText}</a>`;
 
 posterHTML = `
 <div class="d-flex align-items-center mb-3"
 ${avatarInitial}
 <div>
 <strong class="small"${nameLink}</strong>
 ${badge}
 </div>
 </div>`;
 }

 const adType = listing.ad_type || listing.post_type || 'sale';
 let typeBadge = '';
 if (adType === 'wanted') typeBadge = '<span class="badge bg-warning text-dark fw-semibold mb-2"Looking For</span>';
 else if (adType === 'services' || adType === 'service') typeBadge = '<span class="badge bg-warning text-dark fw-semibold mb-2"Service</span>';
 else if (adType === 'event') typeBadge = '<span class="badge bg-secondary fw-semibold mb-2"Event</span>';
 else if (adType === 'rental') typeBadge = '<span class="badge bg-info fw-semibold mb-2"For Rent</span>';
 else if (adType === 'announcement') typeBadge = '<span class="badge bg-secondary fw-semibold mb-2"Notice</span>';
 else typeBadge = '<span class="badge bg-success fw-semibold mb-2"For Sale</span>';
 else if (adType === 'rental') typeBadge = '<span class="badge bg-info mb-2"FOR RENT</span>';
 
 else if (adType === 'announcement') typeBadge = '<span class="badge bg-secondary mb-2"ANNOUNCEMENT</span>';

 let priceHTML = '';
 const pt = listing.price_type || 'fixed';
 if (adType === 'rental' && listing.price) {
 const dur = listing.rental_duration || '';
 const unit = listing.rental_duration_unit || 'day';
 priceHTML = `<p class="fw-bold text-success mb-1"R${listing.price} / ${unit}${dur ? ' (min ' + dur + ')' : ''}</p>`;
 } else if (pt === 'fixed' && listing.price) {
 priceHTML = `<p class="fw-bold text-success mb-1"R${listing.price}</p>`;
 } else if (pt === 'range' && listing.min_price != null && listing.max_price != null) {
 priceHTML = `<p class="fw-bold text-success mb-1"R${listing.min_price} â€“ R${listing.max_price}</p>`;
 } else if (adType === 'wanted') {
 priceHTML = `<p class="text-warning small mb-1"Price flexible</p>`;
 } else {
 priceHTML = `<p class="text-muted small mb-1"Price on request</p>`;
 }

 const defaultPhoto = '/static/img/default-listing.jpg';
 const photoSrc = listing.photo_url || defaultPhoto;
 const shareText = `Check out this listing on Volstruis Gids: ${listing.title}`;
 const shareUrl = `${window.location.origin}${listing.detail_url}`;
 const whatsappShareLink = `https://wa.me/?text=${encodeURIComponent(shareText + ' ' + shareUrl)}`;

 // Level 10 polished card
 const cardHTML = `
 <div class="col-md-4 col-lg-3 mb-3"
 <div class="${cardExtraClasses}- style="${isBusinessType ? 'border-top: 5px solid #E6B800;' : ''}"
 ${isBoosted ? '<div class="promoted-banner"PROMOTED â€¢ Top Spot</div"' : ''}
 
 <div style="height:210px; background-color:#f8f9fa; position:relative; overflow:hidden; border-bottom: 1px solid #eee;"
 <img src="${photoSrc}- alt="Photo-
 style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
 max-width:96%; max-height:96%; object-fit:contain; padding:8px;"
 </div"
 <div class="card-body pb-2"
 ${typeBadge}
 <h6 class="card-title mb-1 fw-semibold- style="line-height:1.3;"${listing.title}</h6"
 <div class="small text-muted mb-2- style="line-height:1.35;"${listing.description ? listing.description.substring(0,95) + (listing.description.length " 95 ? '...' : '') : ''}</div"
 ${priceHTML}
 ${posterHTML}
 <div class="small text-muted d-flex justify-content-between"
 <span>${listing.location}</span>
 </div>
 </div>
 <div class="card-footer bg-transparent border-0 pt-0 pb-3"
 <a href=-${whatsappShareLink}- target=-_blank-
 class="btn btn-success btn-sm w-100 mb-2 d-flex align-items-center justify-content-center gap-2 rounded-pill"
 <i class="bi bi-whatsapp"</i>
 <span>Share on WhatsApp</span>
 </a>
 <button type=-button-
 class="btn btn-outline-info btn-sm w-100 mb-2 d-flex align-items-center justify-content-center gap-2 rounded-pill grok-ask-btn-
 data-grok-listing-id="${listing.id}-
 data-${listing.title}-
 data-grok-description=-${listing.description || ''}-
 data-grok-area=-${listing.location || ''}"
 <img src="{{ url_for('static', filename='img/GrokLogo.png') }}- alt="Grok- height=-15- style="vertical-align: middle;"
 <span"Ask Grok</span"
 </button"
 <a href=-${listing.detail_url}- class="btn btn-sm btn-outline-primary w-100 rounded-pill"
 View Full Ad â†’
 </a="$2"
 </div>
 </div>
 </div>`;
 container.innerHTML += cardHTML;
 });

 hasMore = data.has_more;
 const loadBtn = document.getElementById('load-more-btn');
 const endMsg = document.getElementById('end-of-feed');
 if (loadBtn) loadBtn.style.display = hasMore ? 'inline-block' : 'none';
 if (endMsg) endMsg.classList.toggle('d-none', hasMore || data.listings.length === 0);
 hideLoadingState();
 })
 .catch(err => {
 console.error('Error fetching listings:', err);
 hideLoadingState();
 const container = document.getElementById('listings-container');
 if (!append && container.innerHTML.trim() === '') {
 container.innerHTML = '<div class="col-12 text-center py-5 text-muted"Something went wrong loading listings. Please try again.</div>';
 }
 });
 }

 function applyFilters() {
 currentPage = 1;
 fetchListings(1, false);
 loadPopularCategories();
 }

 function resetFilters() {
 document.getElementById('q').value = '';
 document.getElementById('town').value = '';
 document.getElementById('post_type').value = '';
 const catEl = document.getElementById('category');
 if (catEl) catEl.value = '';
 const url = new URL(window.location);
 url.searchParams.delete('user_id');
 window.history.pushState({}, '', url);
 document.getElementById('user-store-header').classList.add('d-none');
 currentPage = 1;
 fetchListings(1, false);
 loadPopularCategories();
 }

 function filterByUser(userId) {
 const url = new URL(window.location);
 url.searchParams.set('user_id', userId);
 window.history.pushState({}, '', url);
 currentPage = 1;
 fetchListings(1, false);
 loadPopularCategories();
 }

 function filterByCategory(catName) {
 const catEl = document.getElementById('category');
 if (catEl) catEl.value = catName;
 currentPage = 1;
 fetchListings(1, false);
 loadPopularCategories();
 }

 function loadPopularCategories() {
 const q = document.getElementById('q').value.trim();
 const town = document.getElementById('town').value;
 const post_type = document.getElementById('post_type').value;
 const user_id = new URLSearchParams(window.location.search).get('user_id');
 let url = `/api/categories`;
 const params = [];
 if (q) params.push(`q=${encodeURIComponent(q)}`);
 if (town) params.push(`town=${encodeURIComponent(town)}`);
 if (post_type) params.push(`post_type=${post_type}`);
 if (user_id) params.push(`user_id=${user_id}`);
 if (params.length > 0) url += `?${params.join('&')}`;
 fetch(url)
 .then(response => {
 if (!response.ok) throw new Error(`Server error: ${response.status}`);
 return response.json();
 })
 .then(data => {
 const container = document.getElementById('popular-categories');
 if (!container) return;
 container.innerHTML = '';
 const currentCat = document.getElementById('category') ? document.getElementById('category').value.trim() : '';
 data.forEach(cat => {
 if (cat.count > 0) {
 const isActive = cat.name === currentCat;
 const btn = document.createElement('button');
 btn.type = 'button';
 btn.className = `btn btn-sm ${isActive ? 'btn-primary' : 'btn-outline-secondary'} rounded-pill px-3`;
 btn.style.fontSize = '0.8rem';
 btn.innerHTML = `${cat.name} <span class="badge ${isActive ? 'bg-white text-primary' : 'bg-secondary'} ms-1- style="font-size:0.7rem;"${cat.count}</span"`;
 btn.onclick = () => filterByCategory(cat.name);
 btn.title = `Filter to ${cat.name} (${cat.count} listings)`;
 container.appendChild(btn);
 }
 });
 })
 .catch(err => console.error('Error fetching categories:', err));
 }

 function loadMore() {
 if (!hasMore || isLoading) return;
 currentPage++;
 fetchListings(currentPage, true);
 }

 window.onload = function() {
 fetchListings(1, false);
 loadPopularCategories();
 };
</script>
{% endblock %}
