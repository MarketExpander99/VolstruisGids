{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <!-- Navigation -->
    <nav class="mb-4">
        <a href="{{ url_for('main.index') }}" class="btn btn-outline-primary me-2">🏠 Home</a>
        <a href="{{ url_for('listings.create') }}" class="btn btn-success me-2">+ Post New Ad</a>
        
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('main.my_listings') }}" class="btn btn-outline-secondary me-2">My Ads</a>
            <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger">Logout</a>
        {% else %}
            <a href="{{ url_for('auth.login') }}" class="btn btn-outline-primary me-2">Login</a>
            <a href="{{ url_for('auth.register') }}" class="btn btn-primary">Register</a>
        {% endif %}
    </nav>

    <!-- Search & Filter -->
    <form method="GET" class="mb-4">
        <div class="row g-3">
            <div class="col-md-6">
                <input type="text" name="q" value="{{ query }}" class="form-control" placeholder="Search ads...">
            </div>
            <div class="col-md-4">
                <select name="area" class="form-select">
                    <option value="">All Areas</option>
                    <option value="Oudtshoorn" {% if area == 'Oudtshoorn' %}selected{% endif %}>Oudtshoorn</option>
                    <option value="Calitzdorp" {% if area == 'Calitzdorp' %}selected{% endif %}>Calitzdorp</option>
                    <option value="Ladismith" {% if area == 'Ladismith' %}selected{% endif %}>Ladismith</option>
                    <option value="Van Wyksdorp" {% if area == 'Van Wyksdorp' %}selected{% endif %}>Van Wyksdorp</option>
                    <option value="Zoar" {% if area == 'Zoar' %}selected{% endif %}>Zoar</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Search</button>
            </div>
        </div>
    </form>

    <h1 class="mb-4">Latest in Klein Karoo</h1>
    
    <div id="listings-feed" class="row">
        {% include "main/_listing_cards.html" with context %}
    </div>

    <!-- Initial Load More container (will be updated via HTMX oob) -->
    <div id="load-more-container" class="text-center mt-4">
        <button 
            hx-get="/load-more?offset=20"
            hx-target="#listings-feed"
            hx-swap="beforeend"
            class="btn btn-outline-primary">
            Load More Ads
        </button>
    </div>
</div>
{% endblock %}
