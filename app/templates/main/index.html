{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Welcome to VolstruisGids</h1>
    <p class="lead">Klein Karoo se markplein</p>
    
    <a href="{{ url_for('auth_bp.register') }}" class="btn btn-primary">Register</a>
    <a href="{{ url_for('auth_bp.login') }}" class="btn btn-outline-primary">Login</a>
    
    <hr>
    <h3>Latest Listings</h3>
    <div class="row">
        {% for listing in listings %}
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ listing.title }}</h5>
                    <p class="card-text">R{{ listing.price }}</p>
                    <small class="text-muted">{{ listing.area }}</small>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
