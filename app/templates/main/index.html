{% extends "base.html" %}

{% block content %}
<div class="container py-5">

    <!-- Hero -->
    <div class="bg-success text-white rounded-3 p-5 mb-5 text-center">
        <h1 class="display-4 fw-bold">🌵 VolstruisGids</h1>
        <p class="lead mb-4">Klein Karoo's Local Classifieds</p>
        <a href="{{ url_for('listings.create') }}" class="btn btn-light btn-lg px-5 py-3">
            🚀 Post New Listing
        </a>
    </div>

    <!-- Search + Filters (AJAX) -->
    <div class="mb-5">
        <div class="row g-3">
            <div class="col-md-5">
                <input type="text" id="search-input" 
                       class="form-control form-control-lg" 
                       placeholder="Search titles or descriptions...">
            </div>
            <div class="col-md-3">
                <select id="post-type-filter" class="form-select form-select-lg">
                    <option value="">All Types</option>
                    <option value="sale">🛒 For Sale</option>
                    <option value="wanted">🔍 Looking For</option>
                    <option value="announcement">📢 Announcement</option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="town-filter" class="form-select form-select-lg">
                    <option value="">All Towns</option>
                    {% for t in ['Barrydale','Calitzdorp','De Rust','Dysselsdorp','Groenfontein','Ladismith','Oudtshoorn','Van Wyksdorp','Zoar'] %}
                        <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-1">
                <button onclick="loadListings(1, true)" class="btn btn-success btn-lg w-100">🔍</button>
            </div>
        </div>
        <!-- Show All button (appears when any filter is active) -->
        <button id="show-all-btn" onclick="resetAllFilters()" 
                class="btn btn-outline-success d-none mt-3">
            🔄 Show All Listings
        </button>
    </div>

    <h2 class="mb-4">Latest Listings</h2>

    <div id="listings-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
        <!-- Populated by JS -->
    </div>

    <!-- Loading indicator for infinite scroll -->
    <div id="loading" class="text-center py-4 d-none">
        <div class="spinner-border text-success" role="status"></div>
        <p class="mt-2 text-muted">Loading more listings...</p>
    </div>

    <div id="no-more" class="text-center py-4 text-muted d-none">
        🎉 You've reached the end — no more listings.
    </div>
</div>

<script>
let currentPage = 1;
let isLoading = false;
let hasMore = true;
let currentBusinessName = '';
let currentUsername = '';

function loadListings(page = 1, reset = false) {
    if (isLoading) return;
    isLoading = true;
    document.getElementById('loading').classList.remove('d-none');

    const query = document.getElementById('search-input').value;
    const postType = document.getElementById('post-type-filter').value;
    const town = document.getElementById('town-filter').value;

    const params = new URLSearchParams();
    if (query) params.append('q', query);
    if (postType) params.append('post_type', postType);
    if (town) params.append('town', town);
    if (currentBusinessName) params.append('business_name', currentBusinessName);
    if (currentUsername) params.append('username', currentUsername);
    params.append('page', page);

    fetch(`/api/listings?${params.toString()}`)
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('listings-container');
            
            if (reset) container.innerHTML = '';

            if (data.listings.length === 0 && page === 1) {
                container.innerHTML = `<div class="col-12"><div class="alert alert-info">No listings match your filters.</div></div>`;
                hasMore = false;
                updateShowAllButton();
                return;
            }

            data.listings.forEach(listing => {
                // Display header: clickable company OR username
                let displayHeader = '';
                if (listing.is_business_ad && listing.business_name) {
                    displayHeader = `
                        <div class="d-flex align-items-center mb-2">
                            ${listing.business_logo ? 
                                `<img src="${listing.business_logo}" alt="${listing.business_name}" class="rounded-circle me-2" style="width: 24px; height: 24px; object-fit: cover;">` : 
                                `<span class="me-2">🏪</span>`}
                            <a href="#" onclick="filterByBusiness('${listing.business_name}'); event.preventDefault();" 
                               class="small text-success text-decoration-none fw-bold">${listing.business_name}</a>
                        </div>`;
                } else if (listing.username) {
                    displayHeader = `
                        <div class="d-flex align-items-center mb-2">
                            <span class="me-2">👤</span>
                            <a href="#" onclick="filterByUser('${listing.username}'); event.preventDefault();" 
                               class="small text-success text-decoration-none fw-bold">${listing.username}</a>
                        </div>`;
                }

                const cardHTML = `
                    <div class="col">
                        <div class="card h-100 shadow-sm">
                            ${listing.photo_url ? 
                                `<img src="${listing.photo_url}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="${listing.title}">` : 
                                `<img src="/static/images/placeholder.jpg" class="card-img-top" style="height: 200px; object-fit: cover;" alt="No image available">`}
                            <div class="card-body d-flex flex-column">
                                ${displayHeader}
                                <div class="mb-2">
                                    ${listing.post_type === 'wanted' ? 
                                        '<span class="badge bg-warning text-dark fs-6">🔍 Looking For</span>' : 
                                        listing.post_type === 'announcement' ? 
                                        '<span class="badge bg-info fs-6">📢 Announcement</span>' : 
                                        '<span class="badge bg-success fs-6">🛒 For Sale</span>'}
                                </div>
                                <h5 class="card-title">${listing.title}</h5>
                                ${listing.price ? `<h6 class="text-success">${listing.price}</h6>` : ''}
                                <p class="text-muted small">${listing.location}</p>
                                <p class="card-text flex-grow-1">${listing.description}</p>
                                <div class="mt-auto">
                                    <a href="${listing.detail_url}" class="btn btn-success w-100 mb-2">View Details</a>
                                    <a href="https://wa.me/?text=Check this on VolstruisGids: ${encodeURIComponent(listing.title)} ${window.location.origin}${listing.detail_url}" 
                                       target="_blank" class="btn btn-success w-100">
                                        <i class="bi bi-whatsapp"></i> Share
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>`;
                container.innerHTML += cardHTML;
            });

            hasMore = data.has_more;
            currentPage = data.next_page || currentPage;

            if (!hasMore) {
                document.getElementById('no-more').classList.remove('d-none');
            }
            document.getElementById('loading').classList.add('d-none');
            isLoading = false;
            updateShowAllButton();
        })
        .catch(err => {
            console.error('Error loading listings:', err);
            isLoading = false;
            document.getElementById('loading').classList.add('d-none');
        });
}

function filterByBusiness(name) {
    currentBusinessName = name;
    currentUsername = '';
    loadListings(1, true);
}

function filterByUser(name) {
    currentUsername = name;
    currentBusinessName = '';
    loadListings(1, true);
}

function resetAllFilters() {
    currentBusinessName = '';
    currentUsername = '';
    document.getElementById('search-input').value = '';
    document.getElementById('post-type-filter').value = '';
    document.getElementById('town-filter').value = '';
    loadListings(1, true);
}

function updateShowAllButton() {
    const hasFilter = 
        document.getElementById('search-input').value.trim() ||
        document.getElementById('post-type-filter').value ||
        document.getElementById('town-filter').value ||
        currentBusinessName ||
        currentUsername;
    
    const btn = document.getElementById('show-all-btn');
    if (hasFilter) {
        btn.classList.remove('d-none');
    } else {
        btn.classList.add('d-none');
    }
}

// Infinite scroll with Intersection Observer
function setupInfiniteScroll() {
    const sentinel = document.createElement('div');
    sentinel.id = 'sentinel';
    document.getElementById('listings-container').after(sentinel);

    const observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting && hasMore && !isLoading) {
            loadListings(currentPage);
        }
    }, { rootMargin: '300px' });

    observer.observe(sentinel);
}

// Auto-load + live filtering + Show All logic
document.addEventListener('DOMContentLoaded', () => {
    loadListings(1, true);
    setupInfiniteScroll();

    // Live update for Show All button
    const searchInput = document.getElementById('search-input');
    const postTypeSelect = document.getElementById('post-type-filter');
    const townSelect = document.getElementById('town-filter');

    searchInput.addEventListener('input', updateShowAllButton);
    postTypeSelect.addEventListener('change', updateShowAllButton);
    townSelect.addEventListener('change', updateShowAllButton);
});
</script>
{% endblock %}
